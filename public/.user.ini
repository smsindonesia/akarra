; Batas upload PHP ini ikut ter-push ke git dan otomatis terbawa ke server —
; beda dari php.ini sistem, yang harus diatur manual di tiap komputer/server
; (lihat catatan di database/dumps/README.md).
;
; File ini dibaca PHP kalau server jalan lewat PHP-FPM/CGI (umum di hosting
; bersama/cPanel) — bukan di bawah mod_php Apache atau `php artisan serve`,
; yang tetap butuh php.ini/-d diatur langsung. Nilainya menyamai
; config/akarra.php (batas video 50 MB) supaya validasi Laravel dan batas
; PHP tidak lagi bertentangan seperti kasus upload video yang gagal.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
